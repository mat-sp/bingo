<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SP Mates · Bingo matemático</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
    }

    [hidden] {
      display: none !important;
    }

    .access-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.35), transparent 45%),
        #0f172a;
    }

    .access-card {
      width: min(100%, 380px);
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .lock {
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 8px;
      color: #0f172a;
      font-size: 24px;
    }

    p {
      margin: 0 0 22px;
      color: #475569;
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #334155;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
    }

    input,
    button {
      width: 100%;
      min-height: 46px;
      border-radius: 10px;
      font: inherit;
    }

    input {
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
    }

    button {
      margin-top: 12px;
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .error {
      min-height: 20px;
      margin: 12px 0 0;
      color: #b91c1c;
      font-size: 14px;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
    }
  </style>
</head>
<body>
  <main id="accessScreen" class="access-screen">
    <section class="access-card" aria-labelledby="accessTitle">
      <div class="lock" aria-hidden="true">🔒</div>
      <h1 id="accessTitle">Bingo matemático</h1>
      <p>Introduce la contraseña para acceder.</p>

      <form id="accessForm">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          autofocus>
        <button type="submit">Entrar</button>
        <div id="error" class="error" role="alert" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <iframe
    id="app"
    title="SP Mates · Bingo matemático"
    allowfullscreen
    hidden>
  </iframe>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycby3u_5bAzMOD9Ad76DK65m_SJxEANLsEyE2F9IiOuICLT_Kv44iHz-0SE4Ei9th-l3q/exec';
    const PASSWORD_HASH = '04f46e690660ef9c0e64f101f1d8b65c2642d792128af2d93ab77fe071a078bb';

    const accessScreen = document.getElementById('accessScreen');
    const accessForm = document.getElementById('accessForm');
    const passwordInput = document.getElementById('password');
    const error = document.getElementById('error');
    const app = document.getElementById('app');

    async function sha256(value) {
      const data = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest))
        .map(byte => byte.toString(16).padStart(2, '0'))
        .join('');
    }

    accessForm.addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';

      if (await sha256(passwordInput.value) !== PASSWORD_HASH) {
        error.textContent = 'Contraseña incorrecta.';
        passwordInput.select();
        return;
      }

      app.src = APP_URL;
      accessScreen.hidden = true;
      app.hidden = false;
    });
  </script>
</body>
</html>
